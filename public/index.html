<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp QR-код</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
      }
      img {
        width: 300px;
        height: auto;
        margin-top: 20px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        margin-top: 20px;
        cursor: pointer;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Отсканируйте QR-код для входа в WhatsApp</h1>
    <img id="qr-code" src="" alt="QR-код загружается..." />
    <br />
    <button id="refresh-btn" onclick="checkStatus()">🔄 Обновить</button>
    <button id="logout-btn" onclick="logout()" style="display: none">
      Выйти из WhatsApp
    </button>

    <script>
      async function checkStatus() {
        try {
          const response = await fetch("/status");
          if (!response.ok) throw new Error("Ошибка сервера");

          const data = await response.json();
          const qrCode = document.getElementById("qr-code");
          const logoutBtn = document.getElementById("logout-btn");

          if (data.authenticated) {
            qrCode.style.display = "none";
            logoutBtn.style.display = "block";
          } else {
            qrCode.style.display = "block";
            logoutBtn.style.display = "none";

            const qrResponse = await fetch("/qr-image");
            if (qrResponse.ok) {
              const qrData = await qrResponse.text();
              qrCode.src = qrData; // Загружаем QR-код
            }
          }
        } catch (error) {
          console.error("Ошибка:", error);
        }
      }

      async function logout() {
        const response = await fetch("/logout", { method: "POST" });
        if (response.ok) {
          alert("✅ Вы вышли из WhatsApp. Перезапустите сервер!");
          location.reload();
        } else {
          alert("❌ Ошибка выхода");
        }
      }

      checkStatus();
    </script>
  </body>
</html>
