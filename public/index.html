<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp QR-код</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        img { width: 300px; height: auto; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Отсканируйте QR-код для входа в WhatsApp</h1>
    <img id="qr-code" src="" alt="QR-код загружается..." />

    <script>
        async function loadQRCode() {
            const response = await fetch("/qr-image");
            if (response.ok) {
                document.getElementById("qr-code").src = "/qr-image";
            } else {
                document.getElementById("qr-code").alt = "QR-код пока не сгенерирован";
            }
        }
        setInterval(loadQRCode, 5000); // Проверяем QR-код каждые 5 секунд
        loadQRCode();
    </script>
</body>
</html>
